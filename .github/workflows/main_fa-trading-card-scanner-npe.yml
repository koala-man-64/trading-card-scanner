name: Build and deploy Python project to Azure Function App - fa-trading-card-scanner-npe

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.10"
  HUGGINGFACE_HUB_TOKEN: ${{ secrets.HUGGINGFACE_HUB_TOKEN }}
  HF_TOKEN: ${{ secrets.HUGGINGFACE_HUB_TOKEN }}
  TEST_OUTPUT_CONTAINER: processed-tests-ci
  TEST_CARD_FOLDER: deploy-${{ github.run_id }}

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python version
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Start Azurite emulator
        run: |
          AZURITE_ACCOUNT_NAME=devstoreaccount1
          AZURITE_ACCOUNT_KEY="$(openssl rand -base64 64 | tr -d '\n')"
          AZURITE_CONNECTION_STRING="DefaultEndpointsProtocol=http;AccountName=${AZURITE_ACCOUNT_NAME};AccountKey=${AZURITE_ACCOUNT_KEY};BlobEndpoint=http://127.0.0.1:10000/${AZURITE_ACCOUNT_NAME};QueueEndpoint=http://127.0.0.1:10001/${AZURITE_ACCOUNT_NAME};TableEndpoint=http://127.0.0.1:10002/${AZURITE_ACCOUNT_NAME};"
          {
            echo "AZURE_STORAGE_CONNECTION_STRING=${AZURITE_CONNECTION_STRING}"
            echo "AzureWebJobsStorage=${AZURITE_CONNECTION_STRING}"
          } >> "$GITHUB_ENV"
          docker run --name azurite -d --rm \
            -e "AZURITE_ACCOUNTS=${AZURITE_ACCOUNT_NAME}:${AZURITE_ACCOUNT_KEY}" \
            -p 10000:10000 -p 10001:10001 -p 10002:10002 \
            mcr.microsoft.com/azure-storage/azurite \
            azurite --skipApiVersionCheck \
            --blobHost 0.0.0.0 --blobPort 10000 \
            --queueHost 0.0.0.0 --queuePort 10001 \
            --tableHost 0.0.0.0 --tablePort 10002
          sleep 2

      - name: Lint, format, type-check, and test
        run: |
          ruff check .
          ruff format . --check
          mypy . --ignore-missing-imports
          python -m pytest -q

      - name: Build and inspect release artifact
        run: |
          python scripts/package_release.py build release.zip
          python scripts/package_release.py check release.zip
          unzip -l release.zip

      - name: Stop Azurite emulator
        if: always()
        run: docker stop azurite || true

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      id-token: write
      contents: read
    environment: production

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Inspect downloaded artifact
        run: python -m zipfile -l release.zip

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_358139AAE3FC405DA4DBD5D54C7D3A4E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E42A456FE2AF46D3B2A37766BA92DBB1 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_0ED7FAB4F48747BC93FC15C15A3D46D3 }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        id: deploy-to-function
        with:
          app-name: fa-trading-card-scanner-npe
          slot-name: Production
          package: release.zip
