name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:


permissions:
  contents: read

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-24.04

    env:
      AZURE_STORAGE_CONNECTION_STRING: "UseDevelopmentStorage=true"
      AzureWebJobsStorage: "UseDevelopmentStorage=true"
      DELETE_TEST_OUTPUT_CONTAINER: "1"
      TEST_OUTPUT_CONTAINER: processed-tests-ci
      TEST_CARD_FOLDER: ci-${{ github.run_id }}
      HUGGINGFACE_HUB_TOKEN: ${{ secrets.HUGGINGFACE_HUB_TOKEN }}
      HF_TOKEN: ${{ secrets.HUGGINGFACE_HUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Start Azurite emulator
        run: |
          docker run --name azurite -d --rm \
            -p 10000:10000 -p 10001:10001 -p 10002:10002 \
            mcr.microsoft.com/azure-storage/azurite \
            azurite --skipApiVersionCheck \
            --blobHost 0.0.0.0 --blobPort 10000 \
            --queueHost 0.0.0.0 --queuePort 10001 \
            --tableHost 0.0.0.0 --tablePort 10002
          sleep 2

      - name: Lint, Format, and Type-Check
        run: |
          ruff check .
          ruff format . --check
          mypy . --ignore-missing-imports

      - name: Run tests
        run: python -m pytest -q

      - name: Build and inspect release artifact
        run: |
          python scripts/package_release.py build release.zip
          python scripts/package_release.py check release.zip

      - name: Stop Azurite emulator
        if: always()
        run: docker stop azurite || true
